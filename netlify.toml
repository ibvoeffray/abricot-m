# La page est générée par GitHub Actions (.github/workflows/publier.yml) et versionnée dans site/.
# Netlify la publie telle quelle : l'API du Bulletin officiel ne répond pas à ses serveurs de build.
[build]
  command = ""
  publish = "site/"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
