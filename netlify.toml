# Le site est généré à chaque déploiement à partir du Bulletin officiel du Valais.
[build]
  command = "python3 scripts/enquetes_vs.py --home Evionnaz --rayon 15 --jours 45 --tous --out site/index.html --json site/enquetes.json"
  publish = "site/"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
